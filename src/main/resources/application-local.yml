spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/subscription?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:subscription}
    password: ${DB_PASSWORD:subscription}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # VT 환경 기본 10은 보수적 (handoff §7 SHOULD_FIX)
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    com.artinus.membership: DEBUG
