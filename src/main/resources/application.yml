spring:
  application:
    name: subscription
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# 외부 API — csrng + Gemini LLM
external:
  csrng:
    base-url: ${CSRNG_BASE_URL:https://csrng.net/csrng/csrng.php}
    connect-timeout-ms: 1000
    read-timeout-ms: 2000
  llm:
    gemini:
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      model: ${GEMINI_MODEL:gemini-2.0-flash}
      api-key: ${GEMINI_API_KEY:}
      connect-timeout-ms: 2000
      read-timeout-ms: 10000
      # 토큰 절감을 위해 최근 20건으로 고정.
      max-recent-histories: 20

# Resilience4j
resilience4j:
  retry:
    retry-aspect-order: 2
    instances:
      csrng:
        max-attempts: 3
        wait-duration: 200ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - com.artinus.membership.csrng.CsrngException
      gemini:
        max-attempts: 2
        wait-duration: 500ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - com.artinus.membership.llm.GeminiException
  circuitbreaker:
    circuit-breaker-aspect-order: 1
    instances:
      csrng:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - com.artinus.membership.csrng.CsrngException
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
      gemini:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          - com.artinus.membership.llm.GeminiException
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
